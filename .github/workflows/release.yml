name: 릴리스
# v* 태그: 실행 파일 빌드 → 세 OS에서 설치 스크립트로 설치·실행 확인 → GitHub Release에 올림.
# PR과 기본 수동 실행은 빌드·설치 확인만 합니다. v 태그에서 publish=true로 dispatch하면 검증 후 게시합니다.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/release/**'
      - 'scripts/build-resources.mjs'
      - 'packages/filesystem/native/**'
      - 'apps/cli/src/sea.ts'
      - 'apps/cli/src/index.ts'
      - 'apps/cli/src/update.ts'
      - 'apps/cli/src/help.ts'
      - 'package*.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/auto-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 검증 통과 후 정식 게시 (v 태그에서만 허용)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false
jobs:
  build:
    # macOS 실행 파일의 ad-hoc codesign 때문에 macOS에서 세 대상을 모두 만듭니다.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 게시 실행은 v 태그에서만 허용
        if: inputs.publish
        run: test "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF"
      - name: 태그와 package.json 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run release:build
      - name: 업데이트 검증 전용 구버전 빌드 (공개하지 않음)
        run: npm run release:build -- --update-fixture --out update-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afo-release
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afo-update-fixture
          path: update-fixture/
          if-no-files-found: error
          retention-days: 3

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afo-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afo-update-fixture
          path: update-fixture
      - name: 단일 실행 파일 자체 업데이트·최신 건너뛰기·체크섬 거부 검증
        shell: bash
        run: |
          target=$(node -p 'process.platform === "win32" ? "win-x64.zip" : "darwin-" + process.arch + ".tar.gz"')
          node scripts/release/verify-update.mjs --old "update-fixture/afo-$target" --new "release/afo-$target"
      - name: 배포 실행 파일의 본문·촬영일·유사 사진 분석 검증
        shell: bash
        run: |
          target=$(node -p 'process.platform === "win32" ? "win-x64.zip" : "darwin-" + process.arch + ".tar.gz"')
          node scripts/release/verify-smart.mjs --archive "release/afo-$target"
      # 설치 스크립트가 실제로 쓰는 경로(HTTP 다운로드 → SHA256SUMS 대조 → 압축 해제 → 실행 확인)를 로컬 서버로 확인합니다.
      - name: install.sh로 설치하고 합성 폴더 미리보기(macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory release >"$RUNNER_TEMP/afo-http.log" 2>&1 &
          afo_server_pid=$!
          trap 'kill "$afo_server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl -fsS --max-time 1 http://127.0.0.1:8765/SHA256SUMS >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$afo_server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/afo-http.log"; exit 1; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/afo-http.log"; exit 1; fi
          # 빠른 동작은 temp HOME에 만들어 러너 프로필과 상관없이 확인합니다.
          qa_home="$RUNNER_TEMP/qa-home"; mkdir -p "$qa_home"
          HOME="$qa_home" AFO_DOWNLOAD_BASE=http://127.0.0.1:8765 AFO_INSTALL="$RUNNER_TEMP/afo" AFO_NO_MODIFY_PATH=1 sh install.sh
          afo="$RUNNER_TEMP/afo/bin/afo"
          test "$("$afo" --version)" = "afo $(node -p 'require("./package.json").version')"
          wf="$(find "$qa_home/Library/Services" -maxdepth 1 -name 'AFO*.workflow' -print)"; test -n "$wf"
          plutil -lint "$wf/Contents/Info.plist" "$wf/Contents/document.wflow"
          test "$(plutil -extract NSServices.0.NSSendFileTypes.0 raw "$wf/Contents/Info.plist")" = public.folder
          plutil -extract actions.0.action.ActionParameters.COMMAND_STRING raw "$wf/Contents/document.wflow" | grep -F "afo='$afo'"
          dir="$(mktemp -d)/AFO 설치 확인"; mkdir -p "$dir"; printf 'a' > "$dir/보고서.pdf"; printf 'b' > "$dir/사진.JPG"
          AFO_STATE_DIR="$(mktemp -d)" "$afo" preview "$dir"
          test -f "$dir/보고서.pdf" && test -f "$dir/사진.JPG"
      - name: install.ps1로 설치하고 합성 폴더 미리보기(Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WorkingDirectory release -PassThru -WindowStyle Hidden
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 1 http://127.0.0.1:8765/SHA256SUMS | Out-Null; $ready = $true; break }
            catch { if ($server.HasExited) { throw 'Local artifact server exited before becoming ready.' }; Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { Stop-Process -Id $server.Id; throw 'Local artifact server did not become ready.' }
          $env:AFO_DOWNLOAD_BASE = 'http://127.0.0.1:8765'; $env:AFO_INSTALL = "$env:RUNNER_TEMP\afo"; $env:AFO_NO_MODIFY_PATH = '1'
          # 보내기 메뉴는 temp APPDATA에 만들어 러너 프로필과 상관없이 확인합니다.
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'appdata'
          # irm | iex와 같이 UTF-8로 읽은 스크립트 문자열을 실행합니다.
          Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
          $afo = "$env:RUNNER_TEMP\afo\afo.exe"
          $version = node -p "require('./package.json').version"
          if ((& $afo --version) -ne "afo $version") { throw 'afo --version 불일치' }
          # 이 파일의 한글 인코딩에 기대지 않도록 바로 가기 이름(AFO로 정리.lnk)을 코드 포인트로 만듭니다.
          $lnkName = 'AFO' + [char]0xB85C + ' ' + [char]0xC815 + [char]0xB9AC + '.lnk'
          $lnkPath = Join-Path $env:APPDATA "Microsoft\Windows\SendTo\$lnkName"
          if (-not (Test-Path -LiteralPath $lnkPath)) { throw "SendTo shortcut missing: $lnkPath" }
          # WScript.Shell은 한글 경로를 읽지 못해 ASCII 이름으로 복사해 읽습니다(install.ps1과 같은 방식).
          $asciiLnk = Join-Path $env:RUNNER_TEMP 'afo-check.lnk'; Copy-Item -LiteralPath $lnkPath -Destination $asciiLnk -Force
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut($asciiLnk)
          if ($lnk.TargetPath -ne $afo) { throw "SendTo target: $($lnk.TargetPath)" }
          if ($lnk.Arguments -ne 'gui --exit-when-closed') { throw "SendTo arguments: $($lnk.Arguments)" }
          $dir = Join-Path $env:RUNNER_TEMP 'AFO 설치 확인'; New-Item -ItemType Directory $dir | Out-Null
          Set-Content -NoNewline -Path (Join-Path $dir 'report.pdf') -Value 'a'
          $env:AFO_STATE_DIR = Join-Path $env:RUNNER_TEMP 'afo-state'
          & $afo preview $dir
          if ($LASTEXITCODE -ne 0) { throw "preview 실패: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $dir 'report.pdf'))) { throw '미리보기가 파일을 바꿨습니다.' }
          Stop-Process -Id $server.Id

  release:
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afo-release
          path: release
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "AFO $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "AFO $GITHUB_REF_NAME" --generate-notes
          fi
